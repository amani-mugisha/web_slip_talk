{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking...</title>
    <link rel="stylesheet" href="{% static 'talk.css' %}">
    <link rel="i]con" type="image/png" href="{% static 'images/water.png' %}">
    <script src="{% static 'talk.js' %}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background"></div>
    <div class="container">

        <div class="subtitle_area" id="subtitle_area">
            <!-- subtitle OR animation will appear here -->
            <div class="edge-wave"></div>
            <p class="para">Talk Slip speaking...</p>
        </div>

        <div class="buttons">
            <button type="button" class="bt leave" onclick="stopRecording()">🔴 Leave</button>
            <button type="button" class="bt read">🔤 CC</button>
        </div>
    </div>

    <div id="dates">
        <div id="days">days loading...</div>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        window.onload = function () {
            start_talking();
        };
    </script>

</body>

</html>
